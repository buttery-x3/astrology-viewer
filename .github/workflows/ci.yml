name: Milestone checks
on:
  pull_request:
    branches: [codex/development, main]
  push:
    branches: [codex/development]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run validate:content
      - run: npm run validate:notices
      - run: node scripts/verify-assets.mjs
      - run: node scripts/install-browsers.mjs chromium firefox webkit --with-deps
      - run: npm run release:build
      - run: npm run release:verify -- --config playwright.cross-browser.config.ts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-release-candidate
          path: |
            .cache/releases/
            !.cache/releases/build-*/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            .cache/browser-cross-results/
            .cache/browser-cross-results.json
          if-no-files-found: ignore
